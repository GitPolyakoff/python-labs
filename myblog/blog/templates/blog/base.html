<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Блог Полякова</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="{% url 'article_list' %}">Блог Полякова</a>
            <div class="d-flex">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if user.is_authenticated %}
                        <li class="nav-item me-3"><span class="text-warning">Привет, {{ user.username }}!</span></li>
                        
                        {% if user.is_superuser %}
                            <li class="nav-item me-2"><a class="nav-link text-light opacity-75" href="{% url 'category_create' %}">Управление группами</a></li>
                        {% endif %}
                        
                        <li class="nav-item"><a class="btn btn-primary text-white fw-bold px-3 py-1" href="{% url 'article_create' %}">+ Добавить статью</a></li>
                        
                        <li class="nav-item ms-3"><a class="nav-link text-danger" href="{% url 'logout' %}">Выйти</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
                        <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-2" href="{% url 'register' %}">Регистрация</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>

{% extends 'blog/base.html' %}

{% block content %}
<div class="alert alert-danger shadow-sm">
    <h4>Вы уверены, что хотите удалить статью "{{ article.title }}"?</h4>
    <form method="POST" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'article_detail' article.pk %}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
{% endblock %}
